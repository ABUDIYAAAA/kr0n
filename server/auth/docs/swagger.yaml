basePath: /
definitions:
  auth.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      session:
        $ref: '#/definitions/auth.SessionResponse'
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.MessageResponse:
    properties:
      message:
        example: success message
        type: string
    type: object
  auth.ProviderStatus:
    properties:
      connected:
        type: boolean
      scopes:
        items:
          type: string
        type: array
    type: object
  auth.ProvidersResponse:
    properties:
      providers:
        additionalProperties:
          $ref: '#/definitions/auth.ProviderStatus'
        type: object
    type: object
  auth.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.SessionListResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/auth.SessionResponse'
        type: array
    type: object
  auth.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      updated_at:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
    type: object
  auth.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  health.DBCheckResponse:
    properties:
      error:
        example: 'dial tcp 127.0.0.1:5432: connect: connection refused'
        type: string
      status:
        example: db ok
        type: string
    type: object
  health.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: Auth API for kr0n service.
  title: Auth API
  version: "1.0"
paths:
  /auth/email/verification:
    post:
      consumes:
      - application/json
      description: Sends a verification email if the account exists and is unverified.
      parameters:
      - description: Resend payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationRequest'
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/auth.MessageResponse'
      summary: Resend verification email
      tags:
      - auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: Marks the user email as verified using the provided token.
      parameters:
      - description: Verification payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /auth/github/app/callback:
    get:
      description: Saves the GitHub App installation metadata after user authorizes.
      parameters:
      - description: GitHub installation ID
        in: query
        name: installation_id
        required: true
        type: string
      - description: Repository name
        in: query
        name: repository_name
        type: string
      - description: Branch name
        in: query
        name: branch
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing installation_id
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: GitHub App installation callback
      tags:
      - github-app
  /auth/github/install:
    get:
      description: Returns the GitHub App installation URL for the user to authorize.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Initiate GitHub App installation
      tags:
      - github-app
  /auth/github/installations:
    get:
      description: Returns all GitHub App installations linked to the current user.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List GitHub App installations
      tags:
      - github-app
  /auth/google:
    get:
      description: Redirects the user to Google's OAuth consent screen.
      responses:
        "307":
          description: Temporary Redirect
      summary: Initiate Google OAuth
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Validates OAuth state and code, creates/logs in the user, and sets
        a session cookie.
      parameters:
      - description: OAuth code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Missing code or state
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Invalid state
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Google OAuth callback
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in using email and password and sets the session cookie.
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Email not verified
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login with password
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session token and clears the session cookie.
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the profile of the currently logged-in user and their session
        details.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/providers:
    get:
      description: Returns which auth providers are configured on the server.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProvidersResponse'
      summary: List configured providers
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the current session token and extends its expiration time.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Refresh session
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Terminates all active sessions for the authenticated user and clears
        the current session cookie.
      responses:
        "200":
          description: All sessions revoked
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Revoke all sessions
      tags:
      - auth
    get:
      description: Returns a list of all active sessions for the authenticated user.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Terminates a specific session by its ID. Users can only revoke
        their own sessions.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Session revoked
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Revoke session
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a user with email and password and triggers email verification.
      parameters:
      - description: Signup payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Create account
      tags:
      - auth
  /db-check:
    get:
      description: Pings the database and returns connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.DBCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/health.DBCheckResponse'
      summary: Database connectivity check
      tags:
      - health
  /health:
    get:
      description: Returns API health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthResponse'
      summary: Health check
      tags:
      - health
  /webhooks/github:
    post:
      consumes:
      - application/json
      description: Receives and processes GitHub webhook events (push, installation).
      parameters:
      - description: HMAC signature
        in: header
        name: X-Hub-Signature-256
        required: true
        type: string
      - description: Event type
        in: header
        name: X-GitHub-Event
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid signature or event
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: GitHub webhook receiver
      tags:
      - webhooks
swagger: "2.0"
