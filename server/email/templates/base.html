<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Subject }}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f6f7fb;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background: #f6f7fb; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="640"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 640px;
              width: 100%;
              background: #ffffff;
              border-radius: 16px;
              overflow: hidden;
              box-shadow: 0 12px 48px rgba(15, 23, 42, 0.08);
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #0f172a, #1d4ed8);
                  padding: 28px 32px;
                  color: #fff;
                "
              >
                <div
                  style="
                    font-size: 12px;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                    opacity: 0.8;
                  "
                >
                  Kr0n
                </div>
                <div style="font-size: 24px; font-weight: 700; margin-top: 8px">
                  {{ .Subject }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">{{ template "content" . }}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
