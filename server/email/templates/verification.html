{{ define "content" }}
<p style="font-size: 16px; line-height: 1.7; margin: 0 0 16px">
  Hi {{ .Name }},
</p>
<p style="font-size: 16px; line-height: 1.7; margin: 0 0 16px">
  Use the button below to verify your email address. The link expires soon for
  security.
</p>
<p style="margin: 24px 0">
  <a
    href="{{ .Link }}"
    style="
      display: inline-block;
      background: #1d4ed8;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: 700;
    "
    >Verify email</a
  >
</p>
<p style="font-size: 14px; line-height: 1.7; color: #6b7280; margin: 0">
  If the button does not work, paste this link into your browser:
</p>
<p
  style="
    font-size: 14px;
    line-height: 1.7;
    word-break: break-all;
    color: #111827;
  "
>
  {{ .Link }}
</p>
{{ end }}
